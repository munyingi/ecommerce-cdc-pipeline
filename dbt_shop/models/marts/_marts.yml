version: 2

models:
  - name: dim_customer
    description: SCD Type 2 customer dimension, one row per version.
    columns:
      - name: customer_sk
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]

  - name: dim_product
    description: SCD Type 2 product dimension, one row per version.
    columns:
      - name: product_sk
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [not_null]
      - name: price
        data_tests: [not_null]

  - name: dim_date
    description: One row per calendar day.
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: fct_order_items
    description: One row per order line, linked to the dimension versions valid at order time.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: customer_sk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_sk
      - name: product_sk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_sk
      - name: date_key
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_key

  - name: fct_orders
    description: One row per order with lifecycle timestamps.
    columns:
      - name: order_id
        data_tests: [unique, not_null]