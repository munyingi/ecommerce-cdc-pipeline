version: 2

models:
  - name: dim_customer
    description: SCD Type 2 customer dimension, one row per version.
    columns:
      - name: customer_sk
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]

  - name: dim_product
    description: SCD Type 2 product dimension, one row per version.
    columns:
      - name: product_sk
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [not_null]
      - name: price
        data_tests: [not_null]